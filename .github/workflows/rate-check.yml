name: Fortnightly rate check

on:
  schedule:
    - cron: '0 8 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run rate check
        id: check
        run: node scripts/check-rates.mjs
        continue-on-error: true

      - name: Run CCPC cross-check
        id: check_ccpc
        run: node scripts/check-rates-ccpc.mjs
        continue-on-error: true

      # Snapshot the published rates into the append-only history log and
      # regenerate the public /rate-tracker/ page from it. This records what
      # products.json publishes on each check date — scraped values still go
      # through manual review before products.json changes.
      - name: Append rate history and rebuild tracker page
        run: |
          node scripts/append-rate-history.mjs
          node scripts/build-rate-tracker.mjs

      - name: Commit results
        run: |
          git config user.name "borrowclever-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rates/ rate-tracker/
          git diff --staged --quiet || git commit -m "Rate check: $(date +%Y-%m-%d)"
          git push

      - name: Fail workflow if issues detected
        if: steps.check.outcome == 'failure' || steps.check_ccpc.outcome == 'failure'
        run: exit 1
