name: Fortnightly rate check

on:
  schedule:
    - cron: '0 8 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run rate check
        id: check
        run: node scripts/check-rates.mjs
        continue-on-error: true

      - name: Run CCPC cross-check
        id: check_ccpc
        run: node scripts/check-rates-ccpc.mjs
        continue-on-error: true

      # Snapshot the published rates into the append-only history log and
      # regenerate the public /rate-tracker/ page from it. This records what
      # products.json publishes on each check date — scraped values still go
      # through manual review before products.json changes.
      - name: Append rate history and rebuild tracker page
        run: |
          node scripts/append-rate-history.mjs
          node scripts/build-rate-tracker.mjs

      # Move the "Rates verified" stamp on loans.html and cards.html to
      # today. It only goes live when the PR below is merged, so merging is
      # the sign-off that flagged rows were reviewed (see PR body).
      - name: Stamp loans and cards pages as verified
        run: node scripts/stamp-verified.mjs

      # main is protected (PRs only), so results are pushed to a fresh
      # branch and opened as a PR rather than committed directly.
      - name: Commit results to a branch
        id: commit
        run: |
          git config user.name "borrowclever-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rates/ rate-tracker/ data/loans.json data/cards.json loans.html cards.html sitemap.xml
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            branch="automated/rate-check-$(date +%Y%m%d%H%M%S)"
            git checkout -b "$branch"
            git commit -m "Rate check: $(date +%Y-%m-%d)"
            git push -u origin "$branch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with results
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.commit.outputs.branch }}" \
            --title "Rate check: $(date +%Y-%m-%d)" \
            --body "Automated fortnightly rate check results. Check outcome: ${{ steps.check.outcome }}. CCPC cross-check outcome: ${{ steps.check_ccpc.outcome }}.

          ⚠️ This PR also moves the **Rates verified** stamp on loans.html and cards.html to $(date +'%-d %B %Y'). Before merging, resolve every CHANGED / PARSE_FAILED / UNREACHABLE row in rates/CHANGES-$(date +%Y-%m-%d).md (correct products.json and data/*.json, or confirm the published rate by hand). If you can't, drop the changes to loans.html, cards.html, data/loans.json, data/cards.json and sitemap.xml from this PR before merging."

      - name: Fail workflow if issues detected
        if: always() && (steps.check.outcome == 'failure' || steps.check_ccpc.outcome == 'failure')
        run: exit 1
