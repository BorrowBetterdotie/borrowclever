<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Plus Jakarta Sans',Arial,sans-serif;background:#ffffff;position:relative}
.accent{position:absolute;left:0;top:0;bottom:0;width:18px;background:#22c55e}
.logo{position:absolute;left:62px;top:34px;width:420px;height:420px;overflow:hidden}
.logo img{width:420px;height:420px;margin-top:-148px}
.tag{position:absolute;left:74px;top:215px;width:1000px;font-size:68px;line-height:1.08;font-weight:800;letter-spacing:-0.035em;color:#1e2d3d}
.tag em{font-style:normal;color:#3d7c2e}
.band{position:absolute;left:18px;right:0;bottom:0;height:120px;background:#0c0c0c;display:flex;align-items:center;justify-content:space-between;padding:0 60px 0 56px}
.band .url{font-size:30px;font-weight:700;color:#f0f0f0;letter-spacing:-0.01em}
.band .url span{color:#22c55e}
.chips{display:flex;gap:14px}
.chip{font-size:20px;font-weight:600;color:#0c0c0c;background:#22c55e;border-radius:100px;padding:10px 22px}
.chip.o{background:transparent;color:#f0f0f0;border:2px solid rgba(255,255,255,.25)}
</style></head><body>
<div class="accent"></div>
<div class="logo"><img src="../../logo.svg"></div>
<div class="tag">Compare Irish loans by<br>what they <em>really cost</em></div>
<div class="band"><div class="url">borrow<span>clever</span>.ie</div>
<div class="chips"><div class="chip">Banks + credit unions</div><div class="chip o">Ranked by total cost</div></div></div>
</body></html>
